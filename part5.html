  <main>
    <h2>Part 5. Image Gallery</h2>
    <section>
      <h3>Task 11. Interactive jQuery Project</h3>
      <p>Click a thumbnail to enlarge it.</p>
      <button id="gallery-show">Fade In</button>
      <button id="gallery-hide">Fade Out</button>
      <button id="gallery-toggle">Fade Toggle</button>
      <div class="gallery">
        <figure><button class="thumbnail" aria-label="Enlarge: Mountain meadow at sunset"><img src="images/meadow.jpg" alt="Mountain meadow at sunset"></button><figcaption>Mountain meadow at sunset</figcaption></figure>
        <figure><button class="thumbnail" aria-label="Enlarge: Forest lake and sunlit peaks"><img src="images/forest-lake.jpg" alt="Forest lake and sunlit peaks"></button><figcaption>Forest lake and sunlit peaks</figcaption></figure>
        <figure><button class="thumbnail" aria-label="Enlarge: Rocky mountains beside a blue lake"><img src="images/mountains.jpg" alt="Rocky mountains beside a blue lake"></button><figcaption>Rocky mountains beside a blue lake</figcaption></figure>
        <figure><button class="thumbnail" aria-label="Enlarge: Snowy mountains at dusk"><img src="images/winter.jpg" alt="Snowy mountains at dusk"></button><figcaption>Snowy mountains at dusk</figcaption></figure>
      </div>
    </section>
    <dialog id="lightbox" aria-label="Enlarged image">
      <button id="close-lightbox" autofocus>Close</button>
      <img id="large-image" alt="Enlarged gallery image">
      <p id="image-caption"></p>
    </dialog>
  </main>
